name: ai-video-factory

x-local-service: &local-service
  env_file:
    - path: ./.env
      required: false
  environment:
    OUTPUT_DIR: /workspace/data/output
    TEMP_DIR: /workspace/data/tmp
    PYTHONUNBUFFERED: "1"
  init: true
  working_dir: /workspace
  volumes:
    - type: bind
      source: ./data
      target: /workspace/data

services:
  orchestrator:
    <<: *local-service
    build:
      context: .
      dockerfile: docker/local/orchestrator/Dockerfile
    image: ai-video-factory/orchestrator:local
    command: ["python", "scripts/show_tree.py"]

  renderer:
    <<: *local-service
    build:
      context: .
      dockerfile: docker/local/renderer/Dockerfile
    image: ai-video-factory/renderer:local
    shm_size: "2gb"
    command: ["/usr/local/bin/render-phase9"]
