name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Sync project
        run: uv sync --locked --extra dev

      - name: Dependency consistency
        run: uv pip check

      - name: Ruff
        run: uv run --locked --extra dev --no-sync ruff check .

      - name: Pytest
        run: uv run --locked --extra dev --no-sync python -m pytest

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -gt 0) {
                  Write-Error "PowerShell parse errors in $($_.FullName): $($Errors -join '; ')"
                  $Failed = $true
              }
          }
          if ($Failed) {
              exit 1
          }

      - name: Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find docker -type f -name '*.sh' -print0)


  remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Remotion project
        run: npm ci --prefix remotion --no-audit --no-fund

      - name: TypeScript
        run: npm --prefix remotion run typecheck
