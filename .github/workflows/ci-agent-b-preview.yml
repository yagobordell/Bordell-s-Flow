name: Agent B Preview SDK Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/ai_video_factory/bots/agent_b/**"
      - "src/ai_video_factory/bots/workflow.py"
      - "scripts/pipeline/run_b_pipeline.py"
      - "run.ps1"
      - "src/ai_video_factory/providers/agent_b_grids.py"
      - "src/ai_video_factory/providers/openai_batch_images.py"
      - "scripts/pipeline/run_agent_b_preview.py"
      - "scripts/pipeline/setup_agent_b_preview.ps1"
      - "config/agent-b-preview-requirements.txt"
      - "examples/agent_b_preview_phone.json"
      - "tests/unit/b_pipeline/test_agent_b_*.py"
      - ".github/workflows/ci-agent-b-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-sdk:
    name: Agent B SDK offline preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Create isolated preview environment
        run: |
          uv venv --python 3.12 .venv-agent-b
          uv pip install --python .venv-agent-b/bin/python -e ".[dev]" \
            -r config/agent-b-preview-requirements.txt
          uv pip check --python .venv-agent-b/bin/python
      - name: Verify real Agents SDK and registered tools with no API key
        env:
          OPENAI_API_KEY: ""
        run: |
          .venv-agent-b/bin/python -m scripts.pipeline.run_agent_b_preview \
            --preflight \
            --input examples/agent_b_preview_phone.json \
            --project .video_factory_work/agent_b_ci_preview \
            --model gpt-5.1
      - name: Run isolated Agent B unit tests
        env:
          OPENAI_API_KEY: ""
        run: |
          .venv-agent-b/bin/python -m pytest -q \
            tests/unit/b_pipeline/test_agent_b_foundation.py \
            tests/unit/b_pipeline/test_agent_b_runner.py \
            tests/unit/b_pipeline/test_agent_b_preview_cli.py \
            tests/unit/b_pipeline/test_agent_b_grid_continuity.py \
            tests/unit/b_pipeline/test_agent_b_phase3_preview.py \
            tests/unit/b_pipeline/test_agent_b_phase4_integration.py \
            tests/unit/b_pipeline/test_agent_b_phase4_orchestrator.py
  windows-preview:
    name: Agent B Windows VS Code setup smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Parse main run.ps1 launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./run.ps1).Path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Execute exact VS Code PowerShell environment setup and preflight
        shell: pwsh
        env:
          OPENAI_API_KEY: ""
        run: .\\scripts\\pipeline\\setup_agent_b_preview.ps1
