name: Generate uv lock

on:
  push:
    branches:
      - chore/python-uv-lock-2026-09-23

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: chore/python-uv-lock-2026-09-23

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: false

      - name: Generate lockfile
        run: |
          uv lock
          uv lock --check

      - name: Commit lockfile and remove generator workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/generate-uv-lock.yml
          git commit -m "build: add reproducible Python lockfile"
          git push origin HEAD:chore/python-uv-lock-2026-09-23
