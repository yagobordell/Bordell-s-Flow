name: One-time B pipeline import formatting
on:
  push:
    branches:
      - feat/b1-b2-parallel-gpt6-luna-medium
    paths:
      - .format/READY
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
      - name: Apply and verify Ruff fixes
        run: |
          uv sync --locked --extra dev
          uv run --no-sync ruff check --fix .
          uv run --no-sync ruff check .
      - name: Commit only formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: organize imports after legacy bot namespace migration"
            git push origin HEAD:feat/b1-b2-parallel-gpt6-luna-medium
          fi
