name: CI Python

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/**"
      - "tests/**/*.py"
      - "tests/fixtures/**"
      - "infra/**"
      - "config/**"
      - "deploy/**"
      - "docker/**"
      - "scripts/**/*.py"
      - "scripts/**/*.ps1"
      - "scripts/**/*.sh"
      - "run.ps1"
      - "pyproject.toml"
      - "uv.lock"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # FFmpeg apt installation can take >12 min on hosted runners; leave time for pytest.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bordell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bordell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bordell_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Sync project
        run: uv sync --locked --extra dev

      - name: Dependency consistency
        run: uv pip check

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Actual OpenAI Agents SDK integration (offline)
        run: >-
          uv run --locked --with "openai-agents>=0.22,<0.24" --extra dev
          python scripts/pipeline/check_professional_agents_sdk.py

      - name: Initialize test Postgres
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql "$TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          for migration in infra/sql/*.sql; do
            psql "$TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Install required FFmpeg and QR test tools
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1; then packages+=(ffmpeg); fi
          if ! command -v zbarimg >/dev/null 2>&1; then packages+=(zbar-tools); fi
          if (("${#packages[@]}" > 0)); then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          command -v ffmpeg
          command -v zbarimg

      - name: Scan tracked files for OAuth secrets
        run: uv run --no-sync python scripts/security/check_youtube_secrets.py

      - name: Pytest
        run: uv run --no-sync python -m pytest

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @(Get-Item run.ps1) + @(Get-ChildItem scripts -Recurse -Filter *.ps1) |
              ForEach-Object {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors) {
                  throw "PowerShell parse errors in $($_.FullName): $($Errors -join '; ')"
              }
          }

      - name: Short PowerShell runner smoke (no API calls)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          # Run as child PowerShell processes: a CLI's expected nonzero exit
          # must not terminate this parent smoke-test process.
          $HelpText = (& pwsh -NoProfile -File ./run.ps1 --help 2>&1) -join "`n"
          $HelpExit = $LASTEXITCODE
          Write-Host "Shortcut --help exit: $HelpExit"
          Write-Host $HelpText

          $NoScript = (& pwsh -NoProfile -File ./run.ps1 test2 Jorge --no-image 2>&1) -join "`n"
          $NoScriptExit = $LASTEXITCODE
          Write-Host "Shortcut no-script exit: $NoScriptExit"
          Write-Host $NoScript

          $ErrorActionPreference = "Stop"
          if ($HelpExit -ne 0 -or $HelpText -notmatch '--no-image') {
              throw "run.ps1 did not forward --help to the B pipeline"
          }
          if ($NoScriptExit -eq 0 -or $NoScript -notmatch 'Jorge') {
              throw "run.ps1 did not reach managed avatar/script discovery"
          }
          if ($NoScript -notmatch 'No PNG avatar found') {
              throw "run.ps1 did not reach script selection without paid API calls"
          }
          # The expected negative smoke left LASTEXITCODE=1; explicitly mark
          # this workflow step successful after all assertions have passed.
          exit 0

      - name: Bash syntax
        shell: bash
        run: find docker -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

  youtube:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install optional YouTube dependencies
        run: uv sync --locked --extra dev --extra youtube
      - name: Check dependency compatibility
        run: uv pip check
      - name: Test OAuth with real Google auth libraries, no network
        run: uv run --no-sync python -m pytest tests/unit/youtube
      - name: Check OAuth command help without any credentials
        run: uv run --no-sync python scripts/youtube/auth.py --help
      - name: Check publishing CLIs without credentials
        run: |
          uv run --no-sync python scripts/youtube/upload.py --help
          uv run --no-sync python scripts/youtube/publish_run.py --help
          uv run --no-sync python scripts/youtube/reconcile.py --help
      - name: Scan tracked credential safety
        run: uv run --no-sync python scripts/security/check_youtube_secrets.py
