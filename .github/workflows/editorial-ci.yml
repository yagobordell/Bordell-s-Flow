name: Editorial E1 E2 CI

on:
  push:
    branches:
      - feat/e1-e2-editorial-postproduction
  pull_request:
    branches:
      - main
      - feat/pro-editor-broll-cta-grid4-chain-no-b3

jobs:
  python-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src/ai_video_factory/editorial scripts/pipeline/run_b_pipeline.py scripts/pipeline/run_managed.py src/ai_video_factory/publishing.py src/ai_video_factory/managed_media.py tests/unit/editorial
      - run: uv run --no-sync python -m pytest tests/unit/editorial tests/unit/b_pipeline/test_professional_ebook_cta.py tests/unit/b_pipeline/test_b22_motion.py tests/unit/b_pipeline/test_professional_grid_chain.py -q

  remotion-editorial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion/editorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node render.mjs tests/render-smoke.json tests/smoke
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: ffprobe -v error -show_entries stream=codec_name,nb_frames -of json tests/smoke/layer-000.mov
      - name: FFmpeg overlay on synthetic 24-fps source
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=1920x1080:r=24:d=0.5 -f lavfi -i sine=frequency=440:duration=0.5 -frames:v 12 -c:v libx264 -pix_fmt yuv420p -c:a aac tests/smoke-base.mp4
          ffmpeg -hide_banner -loglevel error -y -i tests/smoke-base.mp4 -i tests/smoke/layer-000.mov -filter_complex "[1:v]setpts=PTS-STARTPTS+1/(24*TB)[e1];[0:v][e1]overlay=0:0:format=auto:repeatlast=0:eof_action=pass,format=yuv420p[v]" -map "[v]" -map 0:a:0 -frames:v 12 -c:v libx264 -c:a copy tests/smoke-composed.mp4
          ffprobe -v error -show_entries stream=codec_name,nb_frames -of json tests/smoke-composed.mp4
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=noprint_wrappers=1:nokey=1 tests/smoke-composed.mp4)" = "12"
          python3 - <<'PY'
          import subprocess
          pixel = subprocess.check_output([
              "ffmpeg", "-hide_banner", "-loglevel", "error",
              "-i", "tests/smoke-composed.mp4", "-vf", "crop=2:2:0:0,format=rgb24",
              "-frames:v", "1", "-f", "rawvideo", "-",
          ])
          assert len(pixel) == 12 and pixel[2] > 150 and pixel[0] < 100, pixel
          PY
