name: Generate Remotion lockfile

on:
  push:
    branches:
      - chore/repository-polish-2026-09-23

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/repository-polish-2026-09-23
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generate package-lock.json
        run: npm install --prefix remotion --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add Remotion lockfile"
          git push origin HEAD:chore/repository-polish-2026-09-23
