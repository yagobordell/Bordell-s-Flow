name: CI Remotion

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "remotion/**"
      - "scripts/pipeline/run_b_pipeline.py"
      - ".github/workflows/ci-remotion.yml"
  workflow_dispatch:

concurrency:
  group: ci-remotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remotion:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install Remotion project
        run: npm ci --prefix remotion --no-audit --no-fund

      - name: TypeScript
        run: npm --prefix remotion run typecheck
